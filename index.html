<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siddharam & Swapna | Engagement Invitation</title>
    
    <!-- Tailwind CSS (CDN kept for simplicity in this setup, though npm install is available in package.json) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Playfair Display for headings, Lato for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
      :root {
        /* Default Theme set to Elegant (White & Gold) */
        --c-bg: #FDFBF7;        /* Warm White/Cream */
        --c-card: #FFFFFF;      /* White */
        --c-text: #1F2937;      /* Dark Gray */
        --c-accent: #B8860B;    /* Dark Goldenrod */
        --c-highlight: #8B0000; /* Deep Maroon */
        --c-overlay: rgba(255, 255, 255, 0.95);
      }

      /* Futuristic Rich (Neon) */
      [data-theme='default'] {
        --c-bg: #2E1065;
        --c-card: #4C1D95;
        --c-text: #FFFFFF;
        --c-accent: #D946EF;
        --c-highlight: #F59E0B;
        --c-overlay: rgba(46, 16, 101, 0.8);
      }

      /* Royal Theme */
      [data-theme='royal'] {
        --c-bg: #450a0a;
        --c-card: #7f1d1d;
        --c-text: #fff1f2;
        --c-accent: #fbbf24;
        --c-highlight: #f59e0b;
        --c-overlay: rgba(69, 10, 10, 0.8);
      }

      /* Ocean Theme */
      [data-theme='ocean'] {
        --c-bg: #0f172a;
        --c-card: #1e293b;
        --c-text: #f0f9ff;
        --c-accent: #38bdf8;
        --c-highlight: #0ea5e9;
        --c-overlay: rgba(15, 23, 42, 0.8);
      }

      /* Forest Theme */
      [data-theme='forest'] {
        --c-bg: #052e16;
        --c-card: #14532d;
        --c-text: #f0fdf4;
        --c-accent: #4ade80;
        --c-highlight: #a3e635;
        --c-overlay: rgba(5, 46, 22, 0.8);
      }

      /* Elegant Theme (White & Gold) - Explicit */
      [data-theme='elegant'] {
        --c-bg: #FDFBF7;
        --c-card: #FFFFFF;
        --c-text: #1F2937;
        --c-accent: #B8860B;
        --c-highlight: #8B0000;
        --c-overlay: rgba(255, 255, 255, 0.95);
      }

      /* Sunset Theme */
      [data-theme='sunset'] {
        --c-bg: #431407;
        --c-card: #7c2d12;
        --c-text: #fff7ed;
        --c-accent: #f43f5e;
        --c-highlight: #fbbf24;
        --c-overlay: rgba(67, 20, 7, 0.8);
      }

      /* Midnight Theme */
      [data-theme='midnight'] {
        --c-bg: #000000;
        --c-card: #18181b;
        --c-text: #e4e4e7;
        --c-accent: #6366f1;
        --c-highlight: #ec4899;
        --c-overlay: rgba(0, 0, 0, 0.9);
      }

      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--c-bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--c-card); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--c-accent); 
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Adjustment for light themes */
      [data-theme='elegant'] .glass {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(184, 134, 11, 0.2);
        box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.1);
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
      }
      
      [data-theme='elegant'] .text-glow {
         text-shadow: none;
      }
    </style>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              f: {
                white: 'var(--c-text)',
                pink: 'var(--c-accent)',
                orange: 'var(--c-highlight)',
                blue: 'var(--c-card)',
                purple: 'var(--c-bg)',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Lato"', 'sans-serif'],
              script: ['"Great Vibes"', 'cursive'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            },
            animation: {
                'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                'spin-slow': 'spin 3s linear infinite',
                'zoom-in': 'zoomIn 0.6s ease-out forwards',
            },
            keyframes: {
                fadeInUp: {
                    '0%': { opacity: '0', transform: 'translateY(20px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                },
                zoomIn: {
                    '0%': { opacity: '0', transform: 'scale(0.95)' },
                    '100%': { opacity: '1', transform: 'scale(1)' },
                }
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
  <body class="bg-f-purple text-f-white antialiased selection:bg-f-pink selection:text-white transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
